<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="wm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E0B2B"/>
      <stop offset="50%" stop-color="#3B051A"/>
      <stop offset="100%" stop-color="#1A020B"/>
    </linearGradient>
    <linearGradient id="wm-wine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D61C4E"/>
      <stop offset="50%" stop-color="#8C0F35"/>
      <stop offset="100%" stop-color="#4A051A"/>
    </linearGradient>
  </defs>

  <!-- Icon mark — scaled copy of favicon.svg's decanter/glass artwork -->
  <svg x="0" y="0" width="60" height="60" viewBox="0 0 500 500">
    <rect width="500" height="500" rx="90" fill="url(#wm-bg)"/>

    <g id="decanter-group">
      <path d="M 235 340
               C 215 375, 230 395, 290 395
               C 350 395, 365 375, 345 340
               C 320 330, 260 330, 235 340 Z"
            fill="url(#wm-wine)"/>
      <ellipse cx="290" cy="338" rx="55" ry="8" fill="#FF2B5E" opacity="0.85"/>
      <path d="M 235 370 C 228 355, 240 338, 255 330"
            fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
      <path d="M 268 210
               C 268 245, 280 265, 245 320
               C 210 370, 225 400, 290 400
               C 355 400, 370 370, 335 320
               C 300 265, 312 245, 312 210"
            fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 262 210 C 262 205, 318 205, 318 210" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <line x1="220" y1="412" x2="360" y2="412" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    </g>

    <g id="wine-stream">
      <path d="M 215 152
               C 265 160, 283 185, 283 338
               L 297 338
               C 297 180, 275 148, 222 140 Z"
            fill="url(#wm-wine)"/>
      <path d="M 218 142 C 270 150, 290 180, 290 230" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.4"/>
      <path d="M 262 205 C 258 190, 266 182, 268 182 C 270 182, 272 190, 266 205 Z" fill="#FF2B5E"/>
      <path d="M 315 200 C 322 188, 328 184, 329 185 C 330 186, 326 193, 318 202 Z" fill="#FF2B5E"/>
    </g>

    <g id="tilted-glass" transform="translate(160, 165) rotate(48)">
      <path d="M -30 -10
               C -30 20, -15 38, 0 38
               C 15 38, 30 20, 30 -10
               Z"
            fill="url(#wm-wine)"/>
      <ellipse cx="0" cy="-10" rx="30" ry="6" fill="#FF2B5E"/>
      <path d="M -32 -30
               L -32 -10
               C -32 25, -18 42, 0 42
               C 18 42, 32 25, 32 -10
               L 32 -30"
            fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="0" cy="-30" rx="32" ry="5" fill="none" stroke="#FFFFFF" stroke-width="5"/>
      <line x1="0" y1="42" x2="0" y2="105" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <path d="M -28 105 C -15 102, 15 102, 28 105" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <path d="M -24 -15 C -24 10, -14 28, -4 33" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    </g>
  </svg>

  <!-- Wordmark text "Decanterr" -->
  <text
    x="74"
    y="42"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="700"
    font-size="32"
    letter-spacing="-1"
    fill="#D61C4E"
  >Decanterr</text>
</svg>