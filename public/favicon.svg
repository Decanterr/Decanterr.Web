<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="fg-bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c1a2e"/>
      <stop offset="1" stop-color="#081322"/>
    </linearGradient>
    <linearGradient id="fg-page" x1="26" y1="24" x2="66" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="fg-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Rounded app icon background -->
  <rect width="100" height="100" rx="22" fill="url(#fg-bg)"/>
  <!-- Back page — amber/gold accent, rotated -->
  <rect x="32" y="14" width="40" height="54" rx="6" fill="#f59e0b" opacity="0.55" transform="rotate(9 52 41)"/>
  <!-- Middle page -->
  <rect x="29" y="19" width="40" height="54" rx="6" fill="#0d9488" opacity="0.75" transform="rotate(3.5 49 46)"/>
  <!-- Front page — main teal gradient -->
  <rect x="24" y="24" width="42" height="56" rx="6" fill="url(#fg-page)" filter="url(#fg-shadow)"/>
  <!-- Text line decorations on front page -->
  <rect x="32" y="37" width="26" height="3.5" rx="1.75" fill="white" opacity="0.90"/>
  <rect x="32" y="46" width="20" height="3.5" rx="1.75" fill="white" opacity="0.65"/>
  <rect x="32" y="55" width="24" height="3.5" rx="1.75" fill="white" opacity="0.65"/>
  <rect x="32" y="64" width="15" height="3.5" rx="1.75" fill="white" opacity="0.40"/>
</svg>